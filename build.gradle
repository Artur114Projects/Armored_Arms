buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url 'https://jitpack.io' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.github.Artur114Projects.Armored_Arms:core-plugin:1.3.0-core'
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'core-plugin'

archivesBaseName = archives_name
version = mod_version
group = mod_group_id

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    accessTransformer = file('src/main/resources/META-INF/' + atfile)
}

coreBuildConf {
    resourcesConf {
        replaceProperties([
            "version": mod_version,
            "description": core_version
        ])

        includeFiles 'META-INF/mods.toml', 'pack.mcmeta'
    }

    jarConf {
        atFile = "aa_at.cfg"
        return
    }
}

configurations {
    apiCompile.extendsFrom compile
}

sourceSets {
    api {
        java {
            srcDirs = ['src/api/java']
        }
        compileClasspath += this.project.configurations.getByName("apiCompile")
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:24.0.0'
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    compileOnly sourceSets.api.output

    implementation fg.deobf("curse.maven:fantasy-armor-1083998:9427175")
    core.massDependencies {
        source "libs"

        deObfHook {fg.deobf(it)}
    }
}

jar.finalizedBy('reobfJar')