buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Artur114Projects/Armored_Arms")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
    dependencies {
        classpath ('com.artur114.armoredarms.gradle:core-build:1.2.+')
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+')
    }
}

apply plugin: 'forge'
apply plugin: 'core-build'

compileJava.options.encoding = 'UTF-8'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    mappings = "stable_12"
    runDir = "run"
}

repositories {
    mavenLocal()
}

coreBuildConf {
    jarConf {
        atFile = "aa_at.cfg"
        return
    }
}

dependencies {
    core.massDependencies {
        source "libs"
    }
}