plugins {
    id 'java-library'
    id 'maven-publish'
}

version = coreVersion
group = 'com.artur114.armoredarms'
archivesBaseName = 'ArmoredArmsCore'

repositories {
    mavenCentral()
}

compileJava {
    options.compilerArgs << '-parameters'
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Artur114Projects/Armored_Arms")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            artifactId = 'core'
            from(components.java)
        }
    }
}

dependencies {
    compileOnly 'it.unimi.dsi:fastutil:8.5.14'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.1'
    testImplementation 'it.unimi.dsi:fastutil:8.5.14'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Armored Arms Core",
            "Specification-Vendor": "armoredarmscore",
            "Specification-Version": coreVersion,
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"armoredarmscore",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

test {
    useJUnitPlatform()
}