buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = "https://repo.spongepowered.org/maven" }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath "org.spongepowered:mixingradle:0.7.+"
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: "org.spongepowered.mixin"

version = modVersion
group = modGroup
archivesBaseName = modFileName

if (version.contains("SNAPSHOT")) {
    archivesBaseName = archivesBaseName + "-SNAPSHOT(" + new Date().format("HH'h-'mm'm-T-'dd-MM-yyyy") + ")"
    version = ""
}

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

mixin {
    add sourceSets.main, "mixins.armoredarms.refmap.json"
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    if (atfile != "null") {
        accessTransformer = file('src/main/resources/META-INF/' + atfile)
    }
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            if (properties.get("coreModClass") != "null") {
                jvmArg '-Dfml.coreMods.load=' + properties.get("coreModClass")
            }
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            if (properties.get("coreModClass") != "null") {
                jvmArg '-Dfml.coreMods.load=' + properties.get("coreModClass")
            }
        }
    }
}

configurations {
    apiCompile.extendsFrom compile;
    shade; compile.extendsFrom shade;
}

sourceSets {
    api {
        java {
            srcDirs = ['src/api/java']
        }
        compileClasspath += configurations.apiCompile
    }
}

repositories {
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/Artur114Projects/Armored_Arms")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:24.0.0'

    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    compileOnly fileTree(dir: "libs", includes: ['*.jar'])
    compileOnly sourceSets.api.output

    implementation "org.spongepowered:mixin:0.8.3"
    annotationProcessor 'org.spongepowered:mixin:0.8.3:processor'

    shade 'com.artur114.armoredarms:core:' + coreVersion
}

processResources {
    inputs.property "version", modVersion
    inputs.property "description", coreVersion

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        filesMatching('mcmod.info') {
            expand([
                    version: modVersion,
                    description: coreVersion
            ])
        }
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    from {
        configurations.shade.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    manifest {
        attributes([
            "Specification-Title": modId,
            "Specification-Vendor": author,
            "Specification-Version": modVersion,
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" : author,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "mixins.armoredarms.json",
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true",
            "Core-Version": coreVersion
        ])
        if (coreModClass != "null") {
            attributes "FMLCorePlugin": coreModClass
            attributes "FMLCorePluginContainsFMLMod": "true"
        }
        if (atfile != "null") {
            attributes "FMLAT": atfile
        }
    }
}

jar.finalizedBy('reobfJar')