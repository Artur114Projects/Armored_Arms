plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'core-build' version '1.2.1'
}

base {
    version = 'v' + mod_version
    group = mod_group_id
    archivesName = archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory this.project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source this.sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory this.project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

coreBuildConf {
    doLoadProjectData = false

    dependenciesConf {
        afterDependence fg.deobf("curse.maven:minecraft-comes-alive-reborn-535291:7707268")
        afterDependence fg.deobf("curse.maven:cosmetic-armor-reworked-237307:4600191")
        afterDependence fg.deobf("curse.maven:brimm-armors-tactical-military-armors-1281654:7476385")

        coreConf {
            version = "@core_version@"
            return
        }

        ghPackages {
            credentials {
                // Replace this with your build data, or add the value data to global gradle.properties
                it.password = "@gpr.key@"
                it.username = "@gpr.user@"
            }
        }
    }

    resourcesConf {
        replaceProperties([
                minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                forge_version: forge_version, forge_version_range: forge_version_range,
                loader_version_range: loader_version_range,
                mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                mod_authors: mod_authors, mod_description: mod_description,
        ])

        includeFiles 'META-INF/mods.toml', 'pack.mcmeta'
    }

    jarConf {
        coreVersion = "@core_version@"
        author = "@mod_authors@"
        return
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    core.massDependencies {
        source "libs"

        deObfHook {fg.deobf(it)}
    }
}

mixin {
    add sourceSets.main, 'mixins.armoredarms.refmap.json'
    config 'mixins.armoredarms.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}