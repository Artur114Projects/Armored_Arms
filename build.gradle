plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'core-build' version '1.2.1'
    id 'idea'
}

base {
    version = 'v' + mod_version
    group = mod_group_id
    archivesName = archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
}

repositories {
    mavenLocal()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

coreBuildConf {
    doLoadProjectData = false

    dependenciesConf {
        afterDependence "curse.maven:cosmetic-armor-reworked-237307:5610814"

        coreConf {
            version = "@core_version@"
            return
        }

        ghPackages {
            credentials {
                // Replace this with your build data, or add the value data to global gradle.properties
                it.password = "@gpr.key@"
                it.username = "@gpr.user@"
            }
        }
    }

    resourcesConf {
        replaceProperties([
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
        ])

        includeFiles 'META-INF/mods.toml', 'pack.mcmeta'
    }

    jarConf {
        coreVersion = "@core_version@"
        author = "@mod_authors@"
        return
    }
}

dependencies {
    core.massDependencies {
        source "libs"

//        deObfHook {fg.deobf(it)}
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}