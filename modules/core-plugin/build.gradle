plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'groovy'
}

group = 'com.artur114.armoredarms.gradle'
archivesBaseName = 'ArmoredArmsCoreBuild'
version = corePluginVersion

dependencies {
    compile gradleApi()
    compile localGroovy()
}

gradlePlugin {
    plugins {
        coreBuild {
            implementationClass = 'com.artur114.armoredarms.gradle.CoreBuildPlugin'
            id = 'core-build'
        }
    }
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Artur114Projects/Armored_Arms")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            artifact sourcesJar
            artifact javadocJar
            artifactId = 'core-build'
            from components.java
        }
    }
}

jar {
    manifest {
        attributes([
                "Implementation-Version"  : "${version}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "Implementation-Vendor"   : author
        ])
    }
}

task testAny {
    FileTree tree = project.fileTree(dir: 'build').include('**/*-deobf.jar') as FileTree

    tree.each { File file ->
        println file.name
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    classifier = 'sources'
    from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    classifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives sourcesJar
    archives javadocJar
}