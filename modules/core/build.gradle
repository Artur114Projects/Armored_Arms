plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.artur114.armoredarms'
archivesBaseName = 'ArmoredArmsCore'
version = coreVersion

dependencies {
    compileOnly 'it.unimi.dsi:fastutil:8.5.14'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    testImplementation 'it.unimi.dsi:fastutil:8.5.14'
}

apply from: rootProject.file("scripts/base.gradle")
apply from: rootProject.file("scripts/publish.gradle")